server {
    listen 80;

    # статика React-приложения
    root /usr/share/nginx/html;
    index index.html;

    # запросы к API передаём в backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 120s;  # остановка ВМ может занять до 30 секунд
    }

    # WebSocket: без заголовков Upgrade соединение не установится
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;  # не рвём терминал, пока в нём тишина
    }
}
